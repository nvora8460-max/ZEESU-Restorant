<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#fdf6eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f7c59f" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  
  <!-- Solid Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Smooth Organic Waves -->
  <path d="M 0 350 Q 360 250 720 380 T 1440 280 L 1440 800 L 0 800 Z" fill="url(#accentGrad)"/>
  <path d="M 0 500 Q 400 620 800 480 T 1440 600 L 1440 800 L 0 800 Z" fill="#ff6b35" fill-opacity="0.02"/>

  <!-- Decorative circles -->
  <circle cx="10%" cy="20%" r="150" fill="#f7c59f" fill-opacity="0.05" filter="blur(20px)"/>
  <circle cx="85%" cy="75%" r="220" fill="#ff6b35" fill-opacity="0.04" filter="blur(30px)"/>
</svg>
